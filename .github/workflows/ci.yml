name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plagelio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plagelio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plagelio_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/plagelio_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production
      API_KEY_POSTMAN: 61135a3dc83768741e1c3eb1b8210dc60e78f265fbbe86ddb931a299ab42a3d0
      API_KEY_WEB: ci-only-web-api-key-00000000000000000000000000000000
      API_KEY_MOVIL: ci-only-mobile-api-key-000000000000000000000000000000
      ADMIN_NOMBRE: Administrador CI
      ADMIN_EMAIL: admin@veritas.com
      ADMIN_PASSWORD: SANTOTO_2026—2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Create Prisma schema
        run: npx prisma db push
        working-directory: backend

      - name: Apply integration-test SQL schema
        working-directory: backend
        run: |
          npm run db:migrate
          node <<'NODE'
          const fs = require('node:fs');
          const { Pool } = require('pg');

          const scripts = [
            'database/04_bloque_7_5_1_y_8_roles_usuarios.sql',
            '../database/11_3_version_sesion.sql',
            '../database/11_4_password_reset_tokens.sql',
            '../database/11_4_2_codigos_recuperacion.sql',
            '../database/11_5_indices_anticonflicto_y_rendimiento.sql',
          ];
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });

          (async () => {
            try {
              for (const script of scripts) {
                await pool.query(fs.readFileSync(script, 'utf8'));
              }
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Seed integration-test users
        working-directory: backend
        run: |
          npm run seed
          npm run seed:admin
          ADMIN_EMAIL=admin@veritas.ai ADMIN_PASSWORD='SANTOTO_2026--2' npm run seed

      - name: Register test API clients
        working-directory: backend
        run: |
          node -e "require('./dist/services/apiClients.service').sincronizarClientesApi().catch((error) => { console.error(error); process.exitCode = 1; })"

      - name: Run backend tests
        run: npm test
        working-directory: backend
