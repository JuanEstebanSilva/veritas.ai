<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/plagelio-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark light" />
    <title>Plagelio — Detección estilométrica, similitud y reescritura</title>
    <meta name="description" content="Plagelio mide la perplejidad y el burstiness de cada párrafo, coteja su similitud contra fuentes abiertas y reescribe el estilo sin tocar tus citas." />
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Evita el destello de tema: aplica la preferencia guardada antes de pintar.
      // Marca html.js para que el revelado por scroll sólo oculte cuando hay script.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('plagelio_theme') || localStorage.getItem('veritas_theme');
          var dark = t === 'light' ? false : true;
          d.classList.toggle('dark', dark);
          d.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#06070a' : '#f7f7f9');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ground text-hi font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
